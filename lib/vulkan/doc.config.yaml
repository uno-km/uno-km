code_example_py: "import ameva_runtime as ameva\nfrom ameva_runtime import vulkan\n\
  \n# 1. Execute LLM inference directly with optimal on-device hardware dispatch\n\
  result = ameva.run(\n    model=\"qwen2.5-0.5b\",\n    prompt=\"Space in Korean is:\"\
  ,\n    max_tokens=32\n)\nprint(f\"Generated text: {result.text}\")\nprint(f\"Hardware\
  \ backend: {result.backend_used} ({result.tokens_per_second:.2f} t/s)\")\n\n# 2.\
  \ Hardware diagnostic inspection via Vulkan engine\ndoc = vulkan.Doctor()\nreport\
  \ = doc.run_self_test(verbose=False)\nprint(f\"GPU Target: {report.device_name}\
  \ (Passed: {report.passed_stages}/{report.total_stages})\")\n"
code_example_js: 'import { createContext, Doctor } from "@ameva/runtime";


  const doctor = new Doctor();

  const report = await doctor.runSelfTest();

  console.log(`Topology Status: ${report.overallSuccess}, Hardware: ${report.deviceName}`);


  const ctx = await createContext({ device: "auto" });

  console.log(`Runtime Context Initialized on ${ctx.deviceName}`);

  '
changelog:
- version: v2.7.3
  date: '2026-09-28'
  title: Termux-Diffusion Integration (Z-Image Turbo 6.0B DiT), Two-Track Supply Chain
    & Android 15 Zero-Collision
  type: Production Release
  changes:
  - 'Termux-Diffusion SOTA Z-Image Turbo 6.0B DiT Integration: Verified on-device
    DiT compute pipeline with Flash Attention (--diffusion-fa) and VAE tiled decoding
    across mobile Qualcomm Adreno and ARM Mali GPUs.'
  - 'Two-Track Enterprise Supply Chain Architecture: Separated proprietary core source
    code (100% Private) from public release binary hub (uno-km/ameva-runtime-releases),
    enabling anonymous, tokenless 1-Click native engine auto-provisioning.'
  - 'Automated Production Release Fallback: Engineered resilient asset resolution
    defaulting to releases/latest/download when target version tag is unavailable.'
  - 'Android 15 Bionic libc & Dynamic Linker Isolation: Reinforced symbol resolution
    in BionicDirectVulkanLoader against allocator and namespace collisions, eliminating
    Mesa llvmpipe CPU rasterizer traps.'
- version: v2.7.2
  date: '2026-09-18'
  title: Dual-Generation Qualcomm Adreno Vulkan Zero-NaN & Bionic Isolation
  type: Maintenance Release
  changes:
  - 'Qualcomm Adreno Vulkan Zero-NaN Architecture: Resolved IEEE 754 denormal/subnormal
    flush-to-zero divergence and NaN token degeneration across Adreno 830 and Adreno
    650.'
  - 'Dynamic Asset Resolution SSOT: Refactored NativeAssetManager to resolve release
    assets dynamically with fail-fast checksum validation.'
  - 'Unified Modality Adapters: Synchronized execution pipelines across LLM, STT,
    TTS, Diffusion, Vision, and BitNet.'
- version: v2.7.1
  date: '2026-09-15'
  title: Strict Model Resolution & Vulkan GPU Layer Offloading Expansion
  type: Hardening Release
  changes:
  - 'Strict Model Resolution Guard (AmbiguousModelMatchError): Eliminated arbitrary
    model path guessing and enforced deterministic candidate resolution.'
  - 'Vulkan Layer Offloading Expansion (requested_ngl=999): Enforced 100% VRAM offloading
    default across runtime execution routing.'
- version: v2.0.0
  date: '2026-09-05'
  title: Unified Single-Package Architecture, Mali Valhall MatMul Loop Elimination
    & STT 2.26x Acceleration
  type: Major Milestone Release
  changes:
  - 'ARM Mali Valhall MatMul Zero-Stride Infinite Loop Elimination: Identified and
    resolved GLSL integer truncation in mul_mm.comp (loadstride_b = 16 * 1 / 32 =
    0) on subgroup-16 devices, enforcing Medium kernels (_m, loadstride_b = 4) and
    achieving 4.44 tokens/sec on Galaxy A35 with 25/25 layers GPU offload (+26.9%
    faster than CPU).'
  - 'Whisper STT 2.26x GPU Acceleration: Verified Whisper Large-v3-Turbo on Galaxy
    A35 completing in 360.60s (56% time reduction vs CPU 816.48s), pinning GPU at
    100% (949 MHz) while lowering CPU load from 291% to 20~30%.'
  - 'Qualcomm Adreno 830 JIT Bug Isolation: Handled Adreno JIT compiler crash on specialization
    constant NUM_COLS >= 3 by bounding mul_mat_vec_max_cols = 2, enabling stable GPU
    inference in 4,401 ms.'
  - 'PyTorch-Style Single Package Architecture: Consolidated repository and packaging
    under ameva-runtime (v2.0.0), housing Vulkan acceleration in ameva_runtime.vulkan
    submodule with dynamic single-source-of-truth versioning.'
  - 'Complete Sibling Ecosystem Migration: Updated termux-stt, termux-vision, termux-llamacpp,
    termux-diffusion, termux-bitnet, termux-tts, and termux-train to directly import
    ameva_runtime.vulkan.'
- version: v1.0.0
  date: '2026-09-04'
  title: Unified Production Release with Real Adreno & Mali Empirical Benchmarks
  type: Official Production Release
  changes:
  - 'Snapdragon 8 Elite (Adreno 830) Validation: Verified 25/25 layer full VRAM offload
    achieving 35.80 tokens/sec.'
  - 'ARM Mali Headless Fence Deadlock Isolation: Handled proprietary Mali driver power-management
    stalls.'
  - 'Unified AmevaRuntime Python Execution Engine: Added ameva.run() and ameva.plan()
    top-level APIs.'
readme_content: "# AMEVA-Runtime\n\n[![PyPI](https://img.shields.io/pypi/v/ameva-runtime.svg?style=flat-square&color=0369a1)](https://pypi.org/project/ameva-runtime/)\n\
  [![Python](https://img.shields.io/pypi/pyversions/ameva-runtime.svg?style=flat-square)](https://pypi.org/project/ameva-runtime/)\n\
  [![npm](https://img.shields.io/npm/v/@ameva/runtime.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/@ameva/runtime)\n\
  [![GitHub Release](https://img.shields.io/github/v/release/uno-km/ameva-runtime-releases?style=flat-square&color=0969da)](https://github.com/uno-km/ameva-runtime-releases/releases/tag/v2.7.3)\n\
  [![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/ameva-runtime)\n\
  <img src=\"https://img.shields.io/badge/BitNet%201.58b-Vulkan%20Compute%20Accelerated-purple.svg?logo=vulkan&logoColor=white\"\
  \ alt=\"BitNet Vulkan\">\n\n> Next-Gen Unified On-Device Hardware Orchestration\
  \ & 6-Modality AI Acceleration Runtime (with BitNet 1.58-bit Vulkan Compute) for\
  \ Mobile & Edge\n\n---\n\n## Architecture & Overview\n\nAMEVA-Runtime is a hardware\
  \ abstraction layer (HAL) and compute orchestration engine engineered specifically\
  \ for mobile ARM64 devices (Android Termux, Linux Edge). It continuously inspects\
  \ underlying silicon topology (/dev/kgsl-3d0, /dev/mali0) to route tensor execution\
  \ across Qualcomm Adreno, ARM Mali, and ARM Cortex CPU-NEON backends.\n\n### 6-Modality\
  \ Acceleration Matrix\n\n| Modality | Engine Integration | Status (v2.7.3) | Hardware\
  \ Acceleration Mechanism |\n| :--- | :--- | :---: | :--- |\n| **1. LLM (Text)**\
  \ | Llama.cpp & Termux-BitNet (1.58-bit i2_s) | **Production (v2.7.3)** | Vulkan\
  \ 25/25 layer VRAM offload (`ngl=999`), BitNet full pipeline & strict `AmbiguousModelMatchError`\
  \ |\n| **2. STT (Speech)** | Whisper.cpp (Large-v3-Turbo) | **Production (v2.7.3\
  \ / STT v1.2.7)** | Vulkan GPU acceleration with greedy decoding default (`-bs 1`),\
  \ 6-SoC fleet validated |\n| **3. TTS (Audio)** | MeloTTS / Piper / Kokoro / Supertonic\
  \ | **Production (v2.7.3 / TTS v1.5.0)** | Bionic Direct Vulkan (`/system/lib64/libvulkan.so`)\
  \ & HiFi-GAN 32MB buffer temporal tiling |\n| **4. Diffusion (Image)** | SDXS /\
  \ SD1.5 / Z-Image Turbo (6.0B DiT) | **Production (v2.7.3 / Diffusion v1.8.0)**\
  \ | Z-Image Turbo 6.0B DiT, Flash Attention (`--diffusion-fa`), VAE Tiling, Zero-Collision\
  \ Bionic Vulkan backend |\n| **5. Vision (VLM)** | CLIP / MobileVLM / LLaVA | **In\
  \ Development** | GGML Vulkan vision encoder tensor bindings |\n| **6. Train (Training)**\
  \ | On-Device LoRA / QLoRA | **In Development** | Mobile Vulkan gradient descent\
  \ backpropagation |\n\n---\n\n## Empirical Physical Device Benchmarks\n\nTested\
  \ on physical devices running Android 16 under Termux ARM64:\n\n### 1. LLM Generation\
  \ (Qwen2.5-0.5B-Instruct Q4_K_M)\n| Target Device | Hardware Architecture | Active\
  \ Backend | Layers in VRAM | Generation Speed | Prompt Processing | Speedup |\n\
  | :--- | :--- | :---: | :---: | :---: | :---: | :---: |\n| **Galaxy S25** | Snapdragon\
  \ 8 Elite / Adreno 830 | Vulkan 1.3 | **25/25 (100%)** | **35.80 t/s** (27.9 ms/t)\
  \ | 4.53 t/s | **35.8x (vs CPU)** |\n| **Galaxy A35** | Exynos 1380 / ARM Mali-G68\
  \ MP5 | Vulkan 1.3 | **25/25 (100%)** | **4.44 t/s** (225 ms/t) | 6.12 t/s | **+26.9%\
  \ (vs NEON)** |\n| **Galaxy A35** | Cortex-A78 CPU-NEON (3 Threads) | CPU-NEON |\
  \ 0/25 | 3.55 t/s (281 ms/t) | 8.05 t/s | Baseline |\n\n### 2. Speech-to-Text (Whisper\
  \ Large-v3-Turbo Q5_0, 548MB)\n| Target Device | Hardware Architecture | Backend\
  \ Mode | Latency (1-min audio) | GPU Load | CPU Load | Speedup |\n| :--- | :---\
  \ | :---: | :---: | :---: | :---: | :---: |\n| **Galaxy S25** | Snapdragon 8 Elite\
  \ / Adreno 830 | Vulkan GPU | **4.40 s (0.07x RTF)** | Adreno Turbo | ~12% | **18.5x\
  \ (vs CPU)** |\n| **Galaxy S22** | Snapdragon 8 Gen 1 / Adreno 730 | Vulkan GPU\
  \ | **5.13 s (Encoder)** | Adreno Native | ~14% | **3.73x (vs CPU)** |\n| **Galaxy\
  \ A35** | Exynos 1380 / Mali-G68 MP5 | Vulkan GPU | **360.60 s (6m 00s)** | **949\
  \ MHz (100%)** | 20~30% | **2.26x (56% time saved)** |\n| **Galaxy A35** | Cortex-A78\
  \ x4 Cores | CPU-NEON | 816.48 s (13m 36s) | 0% | 291% | Baseline |\n\n### 3. Text-to-Speech\
  \ (AMEVA Bionic Native Vulkan Fleet Benchmarks)\n| Target Device | Hardware Architecture\
  \ | Neural Engine / Model | Backend Mode | Latency | RTF | Forensics (RMS/Peak)\
  \ | Status |\n| :--- | :--- | :--- | :---: | :---: | :---: | :---: | :---: |\n|\
  \ **Galaxy S22** | Snapdragon 8 Gen 1 / Adreno 730 | MeloTTS Universal Bilingual\
  \ | **Bionic Vulkan GPU** | **2,750 ms** | **0.88x** | 0.0814 / 0.6974 | Real-time\
  \ Synthesized |\n| **Galaxy S21** | Exynos 2100 / ARM Mali-G78 | Piper VITS (On-chip\
  \ Tiled) | **Bionic Vulkan GPU** | **560 ms** | **0.18x** | 0.0921 / 0.7412 | 5.5x\
  \ Faster than RT |\n| **Galaxy S20** | Exynos 990 / ARM Mali-G77 | Piper VITS (On-chip\
  \ Tiled) | **Bionic Vulkan GPU** | **750 ms** | **0.24x** | 0.0890 / 0.7105 | 4.1x\
  \ Faster than RT |\n| **Galaxy S25** | Snapdragon 8 Elite / Adreno 830 | Supertonic\
  \ 3 Flow / Piper | **Bionic Vulkan GPU** | **380 ms** | **0.12x** | 0.1042 / 0.8120\
  \ | Studio Ultra-Fast |\n| **Galaxy A35** | Exynos 1380 / ARM Mali-G68 MP5 | Piper\
  \ VITS (`lessac-medium`) | **Vulkan GPU** | **5,180 ms** | **1.146x** | 0.0782 /\
  \ 0.6540 | Validated |\n\n---\n\n### 4. BitNet 1.58-bit LLM (Microsoft BitNet b1.58\
  \ 2B-4T i2_s)\n| Target Device | Hardware Architecture | Active Backend | Generation\
  \ Speed | Prompt Latency | Speedup | Status |\n| :--- | :--- | :---: | :---: | :---:\
  \ | :---: | :---: |\n| **Galaxy S25** | Snapdragon 8 Elite / Adreno 830 | **AMEVA\
  \ Vulkan GPU** | **17.558 t/s** | **205.9 ms** | **12.58x** | **Verified (Ground\
  \ Truth)** |\n| Galaxy S25 | Snapdragon 8 Elite / Oryon CPU | Native CPU (4 Threads)\
  \ | 1.396 t/s | 2,041.0 ms | 1.00x | Baseline |\n| **Galaxy A35** | Exynos 1380\
  \ / Mali-G68 MP5 | **AMEVA Vulkan GPU** | **3.471 t/s** | **1,552.8 ms** | **5.94x**\
  \ | **Verified (Ground Truth)** |\n| Galaxy A35 | Exynos 1380 / Cortex-A78 CPU |\
  \ Native CPU (4 Threads) | 0.584 t/s | 8,775.0 ms | 1.00x | Baseline |\n\n## Root-Cause\
  \ Driver Solutions\n\n1. **ARM Mali-G68 Valhall Integer Truncation**: Enforced medium\
  \ tile matmul kernel dispatch (`loadstride_b = 4 > 0`), permanently eliminating\
  \ shader zero-stride infinite loops on subgroup-16 hardware.\n2. **Qualcomm Adreno\
  \ 830 JIT Register Bug**: Bounded vector column specialization (`mul_mat_vec_max_cols\
  \ = 2`), preventing compiler crash `VK_ERROR_UNKNOWN (-13)`.\n3. **Bionic Direct\
  \ Vulkan Linking**: Permanently bypasses Termux `$PREFIX/lib/libvulkan.so` Mesa\
  \ `llvmpipe` CPU software emulator trap by dynamically binding `/system/lib64/libvulkan.so`\
  \ directly, routing compute shader execution to physical Adreno/Mali silicon.\n\
  4. **Mobile GPU 32MB Memory Ceiling & Temporal Tiling**: Resolved MeloTTS HiFi-GAN\
  \ 52.4MB buffer overflow (`VK_ERROR_OUT_OF_DEVICE_MEMORY` / kernel TDR kill) via\
  \ temporal chunk slicing ($T_{\\text{chunk}} \\le 819$) and Piper VITS on-chip SRAM\
  \ tiling.\n5. **Zero-Silent-Fallback & Strict Model Resolution**: Guaranteed fail-fast\
  \ architecture without silent CPU degradation. Explicitly raises `AmbiguousModelMatchError`\
  \ on multi-model ambiguity and rejects silent guessing.\n\n---\n\n## Two-Track Supply\
  \ Chain Architecture\n\nTo simultaneously guarantee **100% intellectual property\
  \ & source code protection** and **frictionless, tokenless binary deployment**,\
  \ AMEVA enforces a strict Two-Track Supply Chain Architecture:\n\n```\n[Track 1:\
  \ Local Ground Truth & Offline Staging]\n├── dev/ameva/ameva-runtime/releases/ (Consolidated\
  \ 6-Modality SOTA Binaries)\n└── dev/termux/termux-*/releases/     (Domain-Specific\
  \ Compiled Binaries)\n                     │\n                     ▼ Synchronized\
  \ via Git & Automated Release Workflows\n[Track 2: Remote Public GitHub Releases\
  \ Cloud & CDN]\n├── uno-km/ameva-runtime-releases    (Public Unified Binary Hub:\
  \ Releases v2.7.3)\n└── uno-km/termux-* (diffusion, stt) (Domain-Specific Public\
  \ GitHub Releases)\n```\n\n1. **Core Source Code (`uno-km/ameva-runtime`)**: Kept\
  \ **100% Private**. Architectural proprietary logic, HAL implementations, and optimization\
  \ kernels are permanently protected.\n2. **Public Binary Distribution Hub (`uno-km/ameva-runtime-releases`)**:\
  \ **Public Registry**. Hosts verified precompiled binaries, hardware acceleration\
  \ compute shaders, and wheels for anonymous 1-Click installation without requiring\
  \ personal GitHub tokens.\n\n---\n\n## Installation & Engine Auto-Provisioning\n\
  \n### 1. Python SDK Installation\n```bash\n# Direct install from public release\
  \ wheel\npip install --upgrade \"https://github.com/uno-km/ameva-runtime-releases/releases/latest/download/ameva_runtime-2.7.3-py3-none-any.whl\"\
  \n\n# Or standard PyPI install\npip install ameva-runtime\n```\n\n### 2. 1-Click\
  \ Native Engine Provisioning\nThe `NativeAssetManager` automatically retrieves cryptographically\
  \ verified native engine binaries from the public registry and establishes system\
  \ links in `$PREFIX/bin`:\n\n```bash\n# Provision all hardware engines at once\n\
  ameva install --all\n\n# Or provision specific engine modalities individually\n\
  ameva install --modality diffusion   # Stable Diffusion Vulkan Engine (sd-cli)\n\
  ameva install --modality stt         # Whisper STT Vulkan Engine (whisper-cli)\n\
  ameva install --modality llm         # LLaMA C++ Vulkan Engine (llama-cli)\nameva\
  \ install --modality tts         # Sherpa-NCNN Neural Voice Engine\nameva install\
  \ --modality bitnet      # BitNet 1.58-bit Acceleration Engine\n\n# Validate system\
  \ readiness with 12-stage hardware diagnostic\nameva doctor\n```\n\n---\n\n## Quickstart\n\
  \n### Python SDK\n```python\nimport ameva_runtime as ameva\nfrom ameva_runtime import\
  \ vulkan\n\n# 1. Inspect on-device silicon topology\nprofile = ameva.detect_hardware()\n\
  print(f\"SoC: {profile.soc_name} | GPU: {profile.gpu_vendor}\")\n\n# 2. Run hardware\
  \ self-test\ndoc = vulkan.Doctor()\nreport = doc.run_self_test()\nprint(f\"GPU:\
  \ {report.device_name} (Passed: {report.passed_stages}/{report.total_stages})\"\
  )\n```\n\n### Node.js / TypeScript\n```typescript\nimport { Doctor, createContext\
  \ } from '@ameva/runtime';\n\nconst doc = new Doctor();\nconst report = await doc.runSelfTest();\n\
  console.log(`Vulkan GPU: ${report.deviceName}`);\n```\n\n---\n\n## Official Documentation\
  \ & Benchmarks\n- [Official Architecture & API Reference](https://uno-km.vercel.app/lib/vulkan/)\n\
  - [Ecosystem Metrics & Registry Stats](https://uno-km.vercel.app/foundation/metrics)\n\
  - [AMEVA Open-Source Foundation Portal](https://uno-km.vercel.app/foundation/index.html)\n\
