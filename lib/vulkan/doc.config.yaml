readme_npm_content: '# AMEVA-Runtime (Node.js & TypeScript)


  [![npm](https://img.shields.io/npm/v/@ameva/runtime.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/@ameva/runtime)

  [![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](LICENSE)

  <img src="https://img.shields.io/badge/Vulkan-1.3%20Compute%20Accelerated-purple.svg?logo=vulkan&logoColor=white"
  alt="Vulkan 1.3">

  <img src="https://img.shields.io/badge/Android%20Termux-ARM64%20Bionic-green.svg"
  alt="ARM64 Bionic">


  > Next-Gen Unified On-Device Hardware Orchestration & 6-Modality AI Acceleration
  Runtime for Mobile Node.js & Android Termux


  ---


  ## 1. Overview & 6-Modality Architecture


  `@ameva/runtime` provides high-performance TypeScript and Node.js bindings for on-device
  mobile AI compute. It interfaces directly with Android Bionic `/system/lib64/libvulkan.so`,
  managing asynchronous compute queues, cgroup affinities, and specialized shader
  kernels across Qualcomm Adreno and ARM Mali GPUs.


  | Modality | Native Engine | Hardware Acceleration Mechanism |

  | :--- | :--- | :--- |

  | **Diffusion** | `sd-cli-vulkan` | Z-Image Turbo 6.0B DiT, Flash Attention (`--diffusion-fa`),
  VAE Tiling |

  | **STT** | `whisper-cli-vulkan` | Whisper Large-v3-Turbo Vulkan Compute, Bionic
  Zero-Collision Driver |

  | **LLM** | `llama-cli-vulkan` | GGUF 100% VRAM Layer Offload (`ngl=999`), ARM Cortex
  CPU-NEON Fallback |

  | **TTS** | `sherpa-ncnn-offline-tts` | Sherpa-NCNN Neural Voice Synthesis, Vulkan
  HiFi-GAN On-chip Tiled Vocoder |

  | **BitNet** | `termux-bitnet-cli` | Microsoft BitNet b1.58 (2B-4T i2_s), 1.58-bit
  Ternary Vulkan Acceleration |

  | **Vision** | `termux-vision-cli` | Multimodal VLM (CLIP / MobileVLM / LLaVA) On-Device
  Vision Engine |


  ---


  ## 2. Installation


  ```bash

  # Local project dependency

  npm install @ameva/runtime


  # Or global CLI access

  npm install -g @ameva/runtime

  ```


  ---


  ## 3. CLI Usage


  The package exposes the `ameva` CLI command:


  ```bash

  # 12-Stage Hardware & Silicon Topology Diagnostic

  npx ameva doctor


  # 1-Click Native Engine Provisioning (Downloads from official public registry)

  npx ameva install --all

  npx ameva install --modality diffusion

  npx ameva install --modality stt

  ```


  ---


  ## 4. TypeScript & Node.js Quickstart


  ### Diagnostic Doctor

  ```typescript

  import { Doctor, createContext } from ''@ameva/runtime'';


  // 1. Run 12-Stage Silicon Self-Test

  const doctor = new Doctor();

  const report = await doctor.runSelfTest();

  console.log(`Vulkan GPU Target: ${report.deviceName}`);

  console.log(`Topology Status: ${report.overallSuccess ? ''OPTIMAL'' : ''DEGRADED''}`);


  // 2. Initialize Hardware Context

  const ctx = await createContext({ device: ''auto'' });

  console.log(`Context initialized on ${ctx.deviceName}`);

  ```


  ---


  ## 5. Two-Track Public Binary Registry Alignment


  All native compiled binaries required by `@ameva/runtime` are cryptographically
  verified and distributed through the official public binary registry:

  - **Registry**: [uno-km/ameva-runtime-releases](https://github.com/uno-km/ameva-runtime-releases)

  - **Zero-Silent-Fallback**: Every downloaded binary is matched against pinned SHA-256
  checksums before execution.


  ---


  ## Documentation & Community

  - [Official Architecture & API Reference](https://uno-km.vercel.app/lib/vulkan/)

  - [AMEVA Foundation Portal](https://uno-km.vercel.app/foundation/index.html)


