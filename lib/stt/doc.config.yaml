  "code_example_py": "import termux_stt as stt\n\ntranscriber = stt.UnifiedSTT(engine=\"whisper\", model=\"tiny.ko\")\nresult = transcriber.transcribe(\"meeting_recording.wav\", diarization=True)\nfor segment in result.segments:\n    print(f\"[{segment.speaker}] {segment.start:.2f}s: {segment.text}\")",
  "code_example_js": "import { UnifiedSTT } from \"termux-stt\";\n\nconst stt = new UnifiedSTT({ engine: \"whisper\", model: \"tiny.ko\" });\nconst result = await stt.transcribe(\"audio.wav\", { diarization: true });",
