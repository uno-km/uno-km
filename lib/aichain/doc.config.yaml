why_challenge_en: "Mainstream AI frameworks (LangChain, LlamaIndex, CrewAI) introduce 80+ heavy dependencies, 250MB+ RSS overheads, and frequent C-compilation failures on mobile ARM Android devices."
why_challenge_ko: "기존 데스크톱 AI 프레임워크(LangChain, LlamaIndex 등)는 80개 이상의 무거운 외부 의존성과 250MB 이상의 메모리 점유, ARM 안드로이드 환경에서의 빈번한 C-컴파일 실패로 인해 온디바이스 구동에 한계가 있었습니다."

description_en: "Engineered under the Zero-Heavy-Dependency doctrine: Pure Python stdlib and pure Node.js ESM orchestration for local llama-server, BitNet 1.58b, StateGraph cyclic ReAct loops, SQLite ACID memory, and native Termux hardware APIs."
description_ko: "외부 무거운 의존성 0개 원칙으로 설계되어, 순수 표준 라이브러리만으로 로컬 llama-server, BitNet 1.58b 1-Bit 모델, StateGraph 순환 ReAct 에이전트, SQLite ACID 메모리, 디바이스 하드웨어 제어를 100% 통합합니다."

features:
  - title_en: "Zero External Heavy Dependencies"
    title_ko: "외부 무거운 의존성 0개"
    desc_en: "Pure Python standard library and pure Node.js ESM. Cold start import in under 12.8ms with less than 268KB disk footprint."
    desc_ko: "순수 표준 라이브러리 및 순수 ESM 구성으로 12.8ms의 초고속 임포트와 268KB 미만의 초경량 패키징을 실현합니다."
  - title_en: "StateGraph & Autonomous ReAct Engine"
    title_ko: "StateGraph 순환 상태 머신 및 ReAct 에이전트"
    desc_en: "Deterministic cyclic state machines and autonomous tool-calling loops (LangGraph lightweight edge alternative)."
    desc_ko: "순환 루프와 조건부 라우팅을 지원하는 결정론적 상태 머신 및 자율 도구 호출 루프를 내장합니다."
  - title_en: "Local Server Hardware Fine-Tuning"
    title_ko: "로컬 서버 하드웨어 정밀 튜닝"
    desc_en: "12 hardware tuning flags (threads, ctx, batch, GPU layers, FlashAttention, KV quantization q8_0/q4_0, RoPE) for 0.5B to 14B models."
    desc_ko: "스레드, 컨텍스트 크기, GPU 레이어, FlashAttention, KV캐시 양자화(q8_0/q4_0), RoPE 스케일링 등 12대 하드웨어 제어 옵션을 완전 개방합니다."
  - title_en: "SQLite Long-Term Memory & Cosine RAG"
    title_ko: "SQLite 영속 메모리 및 코사인 벡터 검색"
    desc_en: "Persistent entity key-value storage and pure cosine vector search without ChromaDB or NumPy."
    desc_ko: "ChromaDB나 NumPy 없이 순수 표준 라이브러리만으로 영속 엔티티 저장 및 코사인 유사도 벡터 검색을 지원합니다."
  - title_en: "1-Line REST, SSE & Live Web Dashboard"
    title_ko: "1줄 로컬 REST, SSE 및 실시간 웹 대시보드"
    desc_en: "Exposes any agent over local mobile WiFi with Server-Sent Events, live chat, interactive graph visualizer, and trace profiler table."
    desc_ko: "단 1줄로 REST/SSE 스트리밍 서버 및 무의존성 실시간 웹 대시보드(SSE 채팅, 토폴로지 뷰어, 트레이스 테이블)를 기동합니다."
  - title_en: "Native Android Hardware & Ecosystem Actuation"
    title_ko: "안드로이드 네이티브 하드웨어 및 생태계 도구"
    desc_en: "Direct tool-calling wrappers for Termux-API (battery, sensors, GPS, STT, TTS, vibration) and uno-km ecosystem (STT, Diffusion, Playwright)."
    desc_ko: "배터리 상태, 센서, GPS, 음성인식(STT), 이미지 생성(Diffusion), 모바일 웹 스크래핑(Playwright), 햅틱 진동을 에이전트 도구로 직결합니다."

