code_example_py: |
  from termux_aichain import (
      create_react_agent,
      BitNetChat,
      get_battery_status,
      transcribe_speech,
      generate_diffusion_image,
      vibrate_device,
      HumanMessage
  )

  # 1. Initialize local 1-bit / GGUF model brain
  llm = BitNetChat(base_url="http://127.0.0.1:8080/v1", temperature=0.1)

  # 2. Assemble multimodal sovereign agent
  agent = create_react_agent(
      model=llm,
      tools=[get_battery_status, transcribe_speech, generate_diffusion_image, vibrate_device],
      system_prompt="You are a sovereign multimodal agent running on Android Termux."
  )

  # 3. Autonomous multi-step execution
  state = agent.invoke({
      "messages": [HumanMessage(content="Check battery and generate cyberpunk emblem.")]
  })
  print("Final Output:", state["messages"][-1].content)

code_example_js: |
  import {
    createReactAgent,
    OpenAICompatibleChat,
    getDefaultDeviceTools,
    HumanMessage
  } from "@termux-ai/chain";

  const llm = new OpenAICompatibleChat({
    baseURL: "http://127.0.0.1:8080/v1",
    model: "Llama-3.2-3B-Instruct"
  });

  const agent = createReactAgent({
    model: llm,
    tools: getDefaultDeviceTools()
  });

  const state = await agent.invoke({
    messages: [new HumanMessage("Check device battery status.")]
  });
  console.log("Agent:", state.messages.at(-1).content);

