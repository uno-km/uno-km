  "tagline_en": "Why LangChain on Termux? Bloat & Crash vs 94KB Zero-Dep LCEL & Hardware Native Agents",
  "tagline_ko": "왜 터먹스에선 랭체인 대신 AIChain인가? 수백MB 의존성 폭탄 vs 94KB 제로-의존성 LCEL 및 하드웨어 액추에이션",
  "quick_install_cmd": "pip install termux-aichain\n# or:\nnpm install termux-aichain",
  "why_challenge_en": "Standard enterprise frameworks (LangChain, LlamaIndex, CrewAI) pull in 45+ heavy dependencies (Pydantic-core, Chroma, Tiktoken) weighing 200MB+ that constantly fail to compile on Android Bionic ARM64 and trigger instant Out-Of-Memory (LMK) kernel kills.",
  "why_challenge_ko": "기존 LangChain 및 LlamaIndex는 45개 이상의 무거운 외부 의존성(Pydantic-core, ChromaDB, Tiktoken)으로 인해 안드로이드 Bionic ARM64에서 C/Rust 컴파일 오류를 일으키고, 180MB가 넘는 유휴 메모리 점유로 안드로이드 LMK(Low Memory Killer)에 의해 프로세스가 즉각 강제 종료됩니다.",
  "description_en": "Termux-AIChain provides 100% pure standard-library LCEL pipe chaining (prompt | llm | parser), autonomous StateGraph agents, on-device SQLite vector RAG, and first-class Android smartphone hardware actuation (battery, temperature, haptics, GPS) in a tiny 94KB footprint.",
  "description_ko": "외부 의존성 0개(Zero-Dependency)의 순수 표준 라이브러리 기반으로 LangChain 호환 LCEL 파이프 체이닝(prompt | llm | parser), StateGraph 자율 에이전트, 온디바이스 SQLite 코사인 벡터 검색, 스마트폰 하드웨어 직접 제어(배터리, 온도, 진동, GPS)를 94KB 초경량 코어로 완벽히 제공합니다.",
  "code_example_py": "from termux_aichain import PromptTemplate, OpenAICompatibleChat, StringOutputParser, get_battery_status\n\n# 1. Read physical smartphone hardware telemetry\nbattery = get_battery_status()\n\n# 2. Build LCEL Chain connected to local llama-server (port 8080)\nprompt = PromptTemplate.from_template(\"Phone Telemetry: {status}. Diagnose in 1 sentence:\")\nllm = OpenAICompatibleChat(base_url=\"http://127.0.0.1:8080/v1\", model=\"llama3\", temperature=0.3)\nchain = prompt | llm | StringOutputParser()\n\n# 3. Execute with 0 external dependencies\nreport = chain.invoke({\"status\": battery})\nprint(\"AI Diagnostic:\", report)",
  "code_example_js": "import { PromptTemplate, OpenAICompatibleChat, StringOutputParser, getBatteryStatus } from 'termux-aichain';\n\n// 1. Read physical smartphone hardware telemetry\nconst battery = await getBatteryStatus.func();\n\n// 2. Build LCEL Chain connected to local llama-server (port 8080)\nconst prompt = PromptTemplate.fromTemplate('Phone Telemetry: {status}. Diagnose in 1 sentence:');\nconst llm = new OpenAICompatibleChat({ baseUrl: 'http://127.0.0.1:8080/v1', model: 'llama3', temperature: 0.3 });\nconst chain = prompt.pipe(llm).pipe(new StringOutputParser());\n\n// 3. Execute with 0 npm dependencies\nconst report = await chain.invoke({ status: JSON.stringify(battery) });\nconsole.log('AI Diagnostic:', report);",
