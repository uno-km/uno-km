# lib/llamacpp/doc.config.yaml
name: "Termux-LlamaCpp"
package_name_pypi: "termux-llamacpp"
package_name_npm: "termux-llamacpp"
version: "v1.0.0b1"
release_name: "Production Beta Release"
license: "Apache-2.0"
platform: "Android ARM64 / Termux Bionic"
github_repo_url: "https://github.com/uno-km/termux-llamacpp"

tagline_en: "Production-Grade Prebuilt GGUF LLM Runtime, Model Manager & OpenAI Server for Android ARM64"
tagline_ko: "Android Termux ARM64 전용 제로 컴파일 사전 빌드 GGUF LLM 런타임, 모델 매니저 및 OpenAI 호환 REST/SSE 서버"

quick_install_cmd: "curl -sSL https://raw.githubusercontent.com/uno-km/termux-llamacpp/master/scripts/install.sh | bash\n# or Python / Node.js:\npip install termux-llamacpp\nnpm install -g termux-llamacpp"

why_challenge_en: "Running LLMs on mobile devices typically requires multi-gigabyte compiler toolchains (Clang, CMake, Ninja), lengthy on-device compilation times (15-30 mins), fragile dynamic library linkers, and severe memory thrashing from default mmap allocations."
why_challenge_ko: "스마트폰 및 엣지 단말기에서 로컬 LLM을 실행하려면 수 기가바이트의 컴파일러 툴체인(Clang, CMake, Ninja) 설치, 20~30분에 달하는 기기 발열 컴파일, 공유 라이브러리 동적 링커 누락, 모바일 mmap 메모리 잠금으로 인한 강제 프로세스 종료 등의 심각한 문제가 발생합니다."

description_en: "Ships verified, cryptographically signed Android ARM64 native binaries with bundled shared libraries, enabling instant zero-compilation local inference and a robust OpenAI-compatible REST/SSE supervisor in under 3 seconds."
description_ko: "암호학적으로 검증된 Android Bionic ARM64 네이티브 바이너리와 필수 공유 라이브러리를 단일 패키지로 제공하여, 3초 이내 즉각적인 제로 컴파일 실행과 안정적인 OpenAI 호환 REST/SSE 스트리밍 수퍼바이저 서버를 구현합니다."

features:
  - title_en: "Zero-Compilation Instant Deployment"
    title_ko: "제로 컴파일 즉시 설치"
    desc_en: "Installs verified Android Bionic ARM64 binaries and bundled shared libraries via cryptographic SHA-256 checks in under 3 seconds without local Clang/CMake."
    desc_ko: "Clang이나 CMake 없이 검증된 Android ARM64 바이너리와 공유 라이브러리를 SHA-256 무결성 검증을 거쳐 3초 이내에 원자적으로 설치합니다."
  - title_en: "Real-Device High Throughput"
    title_ko: "실기기 고속 추론 성능"
    desc_en: "Achieves 16.19 tokens/sec prompt processing and 10.23 tokens/sec generation on mobile octa-core CPUs with NEON and DotProd SIMD acceleration."
    desc_ko: "모바일 옥타코어 CPU 환경에서 NEON 및 DotProd SIMD 가속을 통해 프롬프트 처리 16.19 t/s, 토큰 생성 10.23 t/s의 실사용 성능을 제공합니다."
  - title_en: "OpenAI REST & SSE Supervisor"
    title_ko: "OpenAI 호환 REST/SSE 수퍼바이저"
    desc_en: "Built-in reverse proxy supervisor exposing /health, /v1/models, and /v1/chat/completions with real-time SSE streaming and loopback CORS isolation."
    desc_ko: "내장 리버스 프록시 수퍼바이저가 /health, /v1/models, /v1/chat/completions REST 및 실시간 SSE 스트리밍 엔드포인트를 완벽 격리 제공합니다."
  - title_en: "Mobile Memory & Context Resilience"
    title_ko: "모바일 메모리 및 컨텍스트 최적화"
    desc_en: "Applies direct sequential memory loading (--no-mmap) and dedicated single-user 2048-token context allocation (-np 1) preventing memory fragmentation."
    desc_ko: "직접 메모리 로딩(--no-mmap)과 단일 사용자 2048 컨텍스트 전담 할당(-np 1)으로 모바일 메모리 분할을 방지하고 안정성을 극대화합니다."
  - title_en: "Automated Process Lifecycle & Cleanup"
    title_ko: "엄격한 프로세스 수명주기 관리"
    desc_en: "Guarantees 100% process termination on shutdown or error, with bounded health check polling and zero leftover orphaned daemon processes."
    desc_ko: "서버 종료나 예외 발생 시 전용 PID 추적 및 시그널 전파를 통해 백그라운드 좀비 프로세스를 0개로 완전 정리합니다."
  - title_en: "Supply-Chain Cryptographic Integrity"
    title_ko: "공급망 보안 및 암호학적 무결성"
    desc_en: "Enforces Ed25519 signed manifests, anti-downgrade policies, symlink traversal blocking, and pinned-commit build receipts."
    desc_ko: "Ed25519 전자서명 검증, 버전 다운그레이드 방지, 심볼릭 링크 공격 차단 및 고정 커밋 빌드 증적으로 최고 수준의 공급망 보안을 보장합니다."

matrix_table:
  - category: "Inference Engine"
    operations: "llama.cpp (Pinned Commit: 5e6a37cb115dc1074e274ac004373f5661909695)"
    status: "Production"
  - category: "Architecture Support"
    operations: "Android aarch64 / arm64-v8a (NEON, FP16, DotProd)"
    status: "Production"
  - category: "Supported Quantizations"
    operations: "Q4_K_M, Q5_K_M, Q8_0, IQ4_XS, Q2_K, F16 GGUF v3"
    status: "Production"
  - category: "Protocols & APIs"
    operations: "OpenAI Chat Completions (JSON & SSE Stream), Models List, Health Check"
    status: "Production"
  - category: "SDK Bindings"
    operations: "Python 3.9+ (termux-llamacpp), Node.js / TypeScript (termux-llamacpp)"
    status: "Production"
