apps:
  - id: workstation
    name: "AMEVA Workstation"
    badge: "App"
    tagline_ko: "WebGPU 기반 클라이언트 로컬 AI(Qwen2.5), 대용량 문서 맵리듀스 요약, 인앱 비디오 스튜디오 및 자율 AI 멀티 에이전트 오케스트레이션."
    tagline_en: "Client-side local AI platform with WebGPU Qwen2.5, MapReduce document summarizer, in-app video cut & 1-click AI matting studio."
    links:
      launch: "https://ameva-workstation-web-core.vercel.app/"
      github: "https://github.com/uno-km/AMEVA-Workstation-Web"

  - id: infra-index
    name: "InfraIndex | GPU Scanner"
    badge: "App"
    tagline_ko: "글로벌 69개 클라우드 GPU/CPU/스토리지 실시간 시세 집계, AI 반도체 시황 및 논문/뉴스 인텔리전스 플랫폼."
    tagline_en: "Real-time global 69-cloud GPU/CPU/Storage price aggregation, AI semiconductor market intelligence, and paper/news analytics platform."
    links:
      launch: "https://infraindex-platform-front.vercel.app/"

