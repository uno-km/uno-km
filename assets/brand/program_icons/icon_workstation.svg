<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cosmic Space Fill Gradient (우주색 채우기) -->
    <radialGradient id="space-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162244" />
      <stop offset="65%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050914" />
    </radialGradient>

    <!-- Crisp Aqua Cyan & Ocean Sky Blue Ribbon Gradient -->
    <linearGradient id="aqua-sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3A86FF" stop-opacity="0" />
    </radialGradient>

    <filter id="emblem-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- PURE FLOATING DEEP COSMIC CIRCULAR EMBLEM -->
  <g filter="url(#emblem-shadow)">
    <!-- 1. Full Expanded Outer Circle Disc with Deep Cosmic Space Fill (우주색 채우기) -->
    <circle cx="256" cy="256" r="236" fill="url(#space-fill)" stroke="url(#aqua-sky-grad)" stroke-width="12" />

    <!-- 2. Outer Organic Amoeba Universe Ring (100% Full Expanded Loop) -->
    <path d="M 256 50 
             C 370 50, 442 122, 442 236 
             C 442 350, 370 422, 256 422 
             C 142 422, 70 350, 70 236 
             C 70 122, 142 50, 256 50 Z" 
          fill="none" 
          stroke="url(#aqua-sky-grad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          opacity="0.6" />

    <!-- 3. BOLD AMEVA 'A' SKELETON & 60° ORGANIC PSEUDOPOD -->
    <line x1="256" y1="95" x2="190" y2="215" stroke="url(#aqua-sky-grad)" stroke-width="24" stroke-linecap="round" />
    <line x1="190" y1="215" x2="152" y2="315" stroke="url(#aqua-sky-grad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- 60° Inward Organic Branching Pseudopod Node -->
    <line x1="190" y1="215" x2="245" y2="295" stroke="url(#aqua-sky-grad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="10 5" />

    <line x1="256" y1="95" x2="322" y2="215" stroke="url(#aqua-sky-grad)" stroke-width="24" stroke-linecap="round" />
    <line x1="322" y1="215" x2="360" y2="315" stroke="url(#aqua-sky-grad)" stroke-width="24" stroke-linecap="round" />

    <line x1="190" y1="215" x2="322" y2="215" stroke="url(#aqua-sky-grad)" stroke-width="18" stroke-linecap="round" opacity="0.9" />

    <!-- 4. BOLD AMEVA GLOWING NODES -->
    <circle cx="256" cy="95" r="34" fill="url(#cyan-glow)" />
    <circle cx="256" cy="95" r="18" fill="#FFFFFF" stroke="#00F5D4" stroke-width="5" />

    <circle cx="190" cy="215" r="22" fill="#00E5FF" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="152" cy="315" r="28" fill="#00F5D4" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="245" cy="295" r="20" fill="#00F5D4" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="322" cy="215" r="20" fill="#38BDF8" />
    <circle cx="360" cy="315" r="28" fill="#3A86FF" stroke="#FFFFFF" stroke-width="3" />

    <!-- 5. GIGANTIC INTEGRATED TEXT ON COSMIC SPACE FILL -->
    <text x="256" y="415" font-family="'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="900" letter-spacing="1" fill="#FFFFFF" stroke="#050914" stroke-width="18" paint-order="stroke fill" text-anchor="middle">
      WORKSTATION
    </text>
  </g>
</svg>