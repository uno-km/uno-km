<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp Aqua Cyan to Sky Blue Ribbon Gradient -->
    <linearGradient id="integrated-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <!-- Deep Shadow for 3D Depth -->
    <linearGradient id="ribbon-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3A86FF" stop-opacity="0" />
    </radialGradient>

    <filter id="logo-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- UNIFIED STANDALONE AMEVA LOGO & TEXT (NO BLACK BACKGROUND CONTAINER BOX AT ALL!) -->
  <g filter="url(#logo-drop-shadow)">
    <!-- Outer Fluid Amoeba Ribbon Ring -->
    <path d="M 256 36 
             C 390 36, 465 112, 460 240 
             C 455 368, 380 445, 256 440 
             C 132 435, 48 355, 52 235 
             C 57 115, 122 36, 256 36 Z" 
          fill="none" 
          stroke="url(#integrated-grad)" 
          stroke-width="48" 
          stroke-linecap="round" />

    <!-- 3D Fluid Overlay Shadow Curve -->
    <path d="M 220 66 C 330 46, 425 118, 415 230 C 405 332, 312 405, 200 385" 
          fill="none" 
          stroke="url(#ribbon-shade)" 
          stroke-width="24" 
          stroke-linecap="round" />

    <!-- BOLD AMEVA 'A' SKELETON & 60° ORGANIC PSEUDOPOD -->
    <line x1="256" y1="90" x2="162" y2="330" stroke="url(#integrated-grad)" stroke-width="40" stroke-linecap="round" />
    <line x1="256" y1="90" x2="350" y2="330" stroke="url(#integrated-grad)" stroke-width="40" stroke-linecap="round" />
    <line x1="195" y1="235" x2="317" y2="235" stroke="url(#integrated-grad)" stroke-width="32" stroke-linecap="round" />
    
    <!-- 60° Inward Organic Branching Pseudopod Stem -->
    <line x1="195" y1="235" x2="260" y2="320" stroke="#00F5D4" stroke-width="28" stroke-linecap="round" />

    <!-- AMEVA GLOWING NODES -->
    <!-- Top Core Node [1] -->
    <circle cx="256" cy="90" r="40" fill="url(#node-glow)" />
    <circle cx="256" cy="90" r="20" fill="#FFFFFF" stroke="#00F5D4" stroke-width="6" />

    <!-- Left Middle Node [1-1] -->
    <circle cx="195" cy="235" r="26" fill="#00E5FF" stroke="#FFFFFF" stroke-width="5" />

    <!-- Bottom Left Node [1-1-1] -->
    <circle cx="162" cy="330" r="32" fill="#00F5D4" stroke="#FFFFFF" stroke-width="4" />

    <!-- 60° Inward Organic Branch Node [1-1-2] -->
    <circle cx="260" cy="320" r="26" fill="#00F5D4" stroke="#FFFFFF" stroke-width="5" />

    <!-- Right Middle Node [1-2] -->
    <circle cx="317" cy="235" r="24" fill="#38BDF8" />

    <!-- Bottom Right Node [1-2-1] -->
    <circle cx="350" cy="330" r="32" fill="#3A86FF" stroke="#FFFFFF" stroke-width="4" />

    <!-- TEXT DIRECTLY INTEGRATED ONTO THE LOGO (NO BLACK BOX!) -->
    <!-- High-Contrast Bold Text directly at bottom of logo -->
    <text x="256" y="420" font-family="'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#FFFFFF" stroke="#060A14" stroke-width="8" paint-order="stroke fill" text-anchor="middle">
      BROWSER
    </text>
  </g>
</svg>