<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp 3D Aqua Cyan & Sky Blue Ribbon Gradient -->
    <linearGradient id="m365-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <!-- Deep Fluid Shadow for 3D Layering -->
    <linearGradient id="ribbon-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3A86FF" stop-opacity="0" />
    </radialGradient>

    <filter id="m365-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- STANDALONE AMEVA ORGANIC EMBLEM (NO SQUIRCLE BACKGROUND BOX!) -->
  <g filter="url(#m365-drop-shadow)">
    <!-- Outer Fluid Amoeba Ribbon Ring -->
    <path d="M 256 40 
             C 385 40, 460 115, 455 240 
             C 450 365, 375 440, 256 435 
             C 137 430, 55 350, 60 235 
             C 65 120, 127 40, 256 40 Z" 
          fill="none" 
          stroke="url(#m365-ribbon-grad)" 
          stroke-width="48" 
          stroke-linecap="round" />

    <!-- 3D Fluid Overlay Shadow Curve -->
    <path d="M 220 70 C 330 50, 420 120, 410 230 C 400 330, 310 400, 200 380" 
          fill="none" 
          stroke="url(#ribbon-shade)" 
          stroke-width="24" 
          stroke-linecap="round" />

    <!-- BOLD AMEVA 'A' SKELETON & 60° ORGANIC PSEUDOPOD -->
    <!-- Left Leg -->
    <line x1="256" y1="95" x2="165" y2="330" stroke="url(#m365-ribbon-grad)" stroke-width="40" stroke-linecap="round" />
    <!-- Right Leg -->
    <line x1="256" y1="95" x2="345" y2="330" stroke="url(#m365-ribbon-grad)" stroke-width="40" stroke-linecap="round" />
    <!-- Crossbar -->
    <line x1="198" y1="240" x2="312" y2="240" stroke="url(#m365-ribbon-grad)" stroke-width="32" stroke-linecap="round" />
    
    <!-- 60° Inward Organic Branching Pseudopod Stem -->
    <line x1="198" y1="240" x2="260" y2="325" stroke="#00F5D4" stroke-width="28" stroke-linecap="round" />

    <!-- AMEVA GLOWING NODES -->
    <!-- Top Core Node [1] -->
    <circle cx="256" cy="95" r="40" fill="url(#node-glow)" />
    <circle cx="256" cy="95" r="20" fill="#FFFFFF" stroke="#00F5D4" stroke-width="6" />

    <!-- Left Middle Node [1-1] -->
    <circle cx="198" cy="240" r="26" fill="#00E5FF" stroke="#FFFFFF" stroke-width="5" />

    <!-- Bottom Left Node [1-1-1] -->
    <circle cx="165" cy="330" r="32" fill="#00F5D4" stroke="#FFFFFF" stroke-width="4" />

    <!-- ⭐ 60° Inward Organic Branch Node [1-1-2] -->
    <circle cx="260" cy="325" r="26" fill="#00F5D4" stroke="#FFFFFF" stroke-width="5" />

    <!-- Right Middle Node [1-2] -->
    <circle cx="312" cy="240" r="24" fill="#38BDF8" />

    <!-- Bottom Right Node [1-2-1] -->
    <circle cx="345" cy="330" r="32" fill="#3A86FF" stroke="#FFFFFF" stroke-width="4" />
  </g>

  <!-- EXACT M365 STYLE BOTTOM RIGHT SOLID BLACK BADGE TAG -->
  <g transform="translate(0, 0)" filter="url(#m365-drop-shadow)">
    <!-- Solid Pure Black Tag Plate Overlapping Bottom Right -->
    <rect x="272" y="380" width="200" height="76" rx="18" fill="#000000" stroke="#1E293B" stroke-width="3" />
    
    <!-- Ultra Bold Crisp White Text -->
    <text x="372.0" y="418" font-family="'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">
      BROWSER
    </text>
  </g>
</svg>