<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Background -->
    <linearGradient id="bg-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Crisp Aqua Cyan & Ocean Sky Blue Gradient (NO Purple, NO Red) -->
    <linearGradient id="aqua-sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <!-- Core Node Glow -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3A86FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-space)" stroke="rgba(0, 245, 212, 0.25)" stroke-width="6" />

  <!-- Outer Organic Universe Ring (Automated Flow) -->
  <path d="M 256 86 
           C 354 86, 426 158, 426 256 
           C 426 354, 354 426, 256 426 
           C 158 426, 86 354, 86 256 
           C 86 158, 158 86, 256 86 Z" 
        fill="none" 
        stroke="url(#aqua-sky-grad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-dasharray="740" 
        stroke-dashoffset="65" 
        opacity="0.45" />

  <!-- SKELETON CONNECTIONS -->
  <!-- Root [1] -> Left Leg [1-1] -> Bottom Left [1-1-1] -->
  <line x1="256" y1="135" x2="195" y2="260" stroke="url(#aqua-sky-grad)" stroke-width="20" stroke-linecap="round" />
  <line x1="195" y1="260" x2="155" y2="365" stroke="url(#aqua-sky-grad)" stroke-width="20" stroke-linecap="round" />

  <!-- ⭐ NEW LONGER INWARD ORGANIC BRANCH: Node [1-1] -> [1-1-2] (Pointing Inward Right-Downward, Longer Stem) -->
  <line x1="195" y1="260" x2="248" y2="338" stroke="url(#aqua-sky-grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="8 4" />

  <!-- Root [1] -> Right Leg [1-2] -> Bottom Right [1-2-1] -->
  <line x1="256" y1="135" x2="317" y2="260" stroke="url(#aqua-sky-grad)" stroke-width="20" stroke-linecap="round" />
  <line x1="317" y1="260" x2="357" y2="365" stroke="url(#aqua-sky-grad)" stroke-width="20" stroke-linecap="round" />

  <!-- Crossbar/Bridge connection -->
  <line x1="195" y1="260" x2="317" y2="260" stroke="url(#aqua-sky-grad)" stroke-width="14" stroke-linecap="round" opacity="0.85" />

  <!-- NODES -->
  <!-- [1] Root Node (Top) -->
  <circle cx="256" cy="135" r="32" fill="url(#cyan-glow)" />
  <circle cx="256" cy="135" r="18" fill="#FFFFFF" stroke="#00F5D4" stroke-width="4" />

  <!-- [1-1] Left Middle Node -->
  <circle cx="195" cy="260" r="20" fill="#00E5FF" stroke="#FFFFFF" stroke-width="3" />

  <!-- [1-1-1] Left Bottom Primary Node -->
  <circle cx="155" cy="365" r="26" fill="#00F5D4" />

  <!-- ⭐ [1-1-2] Inward Organic Pseudopod Node (Longer stem, pointing inward right-downward) -->
  <circle cx="248" cy="338" r="17" fill="#00F5D4" stroke="#FFFFFF" stroke-width="3.5" />

  <!-- [1-2] Right Middle Node -->
  <circle cx="317" cy="260" r="18" fill="#38BDF8" />

  <!-- [1-2-1] Right Bottom Primary Node -->
  <circle cx="357" cy="365" r="26" fill="#3A86FF" />
</svg>
